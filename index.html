<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZhiraTab</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <!-- ───────────────────────────── TOP BAR ───────────────────────────── -->
  <header class="top-bar">
    <button id="theme-toggle" title="Toggle light / dark mode">🌙</button>
    <div id="clock-display">
      <span id="time">00:00:00</span>
      <span id="date"></span>
    </div>
  </header>

  <!-- ─────────────────────────── MAIN CONTENT ────────────────────────── -->

  <!-- left side decoration -->
  <aside class="side-panel side-panel--left" aria-hidden="true">
    <div class="side-dots"></div>
    <span class="side-label">ZhiraTab</span>
    <div class="side-line"></div>
    <div class="side-shapes">
      <div class="side-shape side-shape--ring"></div>
      <div class="side-shape side-shape--dot"></div>
      <div class="side-shape side-shape--dot side-shape--dot-2"></div>
    </div>
  </aside>

  <!-- right side decoration -->
  <aside class="side-panel side-panel--right" aria-hidden="true">
    <div class="side-dots"></div>
    <span class="side-label">Focus · Flow · Done</span>
    <div class="side-line"></div>
    <div class="side-shapes">
      <div class="side-shape side-shape--ring"></div>
      <div class="side-shape side-shape--dot"></div>
      <div class="side-shape side-shape--dot side-shape--dot-2"></div>
    </div>
  </aside>

  <main class="container">

    <!-- GREETING -->
    <section class="card greeting-card">
      <h1 id="greeting-text">Good morning!</h1>
      <p id="greeting-sub">What will you accomplish today?</p>
      <div class="name-row">
        <input id="name-input" type="text" placeholder="Enter your name…" maxlength="30" />
        <button id="name-save-btn">Save</button>
      </div>
    </section>

    <!-- FOCUS TIMER -->
    <section class="card timer-card">
      <h2>Focus Timer</h2>

      <div class="timer-config">
        <label for="timer-minutes">Minutes:</label>
        <input id="timer-minutes" type="number" min="1" max="120" value="25" />
      </div>

      <div class="timer-ring-wrap" id="timer-ring-wrap">
        <svg class="timer-ring-svg" viewBox="0 0 160 160" width="160" height="160">
          <circle class="timer-ring-track"    cx="80" cy="80" r="70"/>
          <circle class="timer-ring-progress" cx="80" cy="80" r="70" id="timer-ring-progress"/>
        </svg>
        <div class="timer-display" id="timer-display">25:00</div>
      </div>

      <div class="timer-buttons">
        <button id="timer-start">▶ Start</button>
        <button id="timer-stop" disabled>⏸ Stop</button>
        <button id="timer-reset">↺ Reset</button>
      </div>
    </section>

    <!-- TO-DO LIST -->
    <section class="card todo-card">
      <h2>To-Do List</h2>

      <div class="todo-input-row">
        <input id="todo-input" type="text" placeholder="Add a task…" maxlength="100" />
        <button id="todo-add-btn">Add</button>
      </div>

      <div class="todo-controls">
        <label for="sort-select">Sort:</label>
        <select id="sort-select">
          <option value="default">Default</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
          <option value="done">Done last</option>
        </select>
      </div>

      <ul id="todo-list"></ul>
    </section>

    <!-- ALARM -->
    <section class="card alarm-card">
      <h2>⏰ Alarms</h2>

      <div class="alarm-input-row">
        <input id="alarm-time"  type="time" />
        <input id="alarm-label" type="text" placeholder="Label (optional)" maxlength="30" />
        <button id="alarm-add-btn">Add</button>
      </div>

      <ul id="alarm-list"></ul>

      <!-- Alarm ring modal -->
      <div id="alarm-modal" class="alarm-modal hidden">
        <div class="alarm-modal-box">
          <div class="alarm-modal-icon">⏰</div>
          <div id="alarm-modal-label" class="alarm-modal-label">Alarm!</div>
          <div id="alarm-modal-time"  class="alarm-modal-time"></div>
          <button id="alarm-dismiss-btn">Dismiss</button>
        </div>
      </div>
    </section>

    <!-- QUICK LINKS -->
    <section class="card links-card">
      <h2>Quick Links</h2>

      <div class="link-input-row">
        <input id="link-name" type="text" placeholder="Label" maxlength="20" />
        <input id="link-url"  type="url"  placeholder="https://…" />
        <button id="link-add-btn">Add</button>
      </div>

      <div id="links-grid"></div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
